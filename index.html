<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eeebe3">
  <title>매출 노트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main class="lock" id="lock" hidden>
    <form class="lock-card" id="lock-form">
      <h1>매출 노트</h1>
      <p>쇼핑몰 하루 매출을 보는 곳이에요. 함께 쓰는 비밀번호를 넣어 주세요.</p>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input class="input" id="pw" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="lock-error" role="alert"></p>
      <button class="btn btn-act" type="submit">열기</button>
    </form>
  </main>

  <div id="app" hidden>
    <div class="wrap">
      <header class="top">
        <div>
          <a class="brand" href="/">매출 노트</a>
          <p class="top-note" id="last-upload"></p>
        </div>
        <div class="top-actions">
          <a class="btn btn-act" href="/admin">CSV 올리기</a>
        </div>
      </header>

      <div id="view" aria-live="polite"></div>

      <p class="foot">숫자는 올린 CSV로만 계산해요. 취소·반품·환불 주문은 뺐어요.
        <button class="link-btn" id="lock-btn" type="button">잠그기</button></p>
    </div>
  </div>

  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
