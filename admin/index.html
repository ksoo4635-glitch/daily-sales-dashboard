<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eeebe3">
  <title>매출 노트 · CSV 올리기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main class="lock" id="lock" hidden>
    <form class="lock-card" id="lock-form">
      <h1>매출 노트</h1>
      <p>CSV를 올리고 목표를 넣는 곳이에요. 함께 쓰는 비밀번호를 넣어 주세요.</p>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input class="input" id="pw" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="lock-error" role="alert"></p>
      <button class="btn btn-act" type="submit">열기</button>
    </form>
  </main>

  <div id="app" hidden>
    <div class="wrap">
      <header class="top">
        <div>
          <a class="brand" href="/">매출 노트</a>
          <p class="top-note">CSV를 올리고, 이달 목표를 넣는 곳</p>
        </div>
        <div class="top-actions"><a class="btn btn-plain" href="/">대시보드 보기</a></div>
      </header>

      <section class="panel" aria-labelledby="up-title">
        <h2 id="up-title">CSV 올리기</h2>
        <p class="sub">쇼핑몰 관리자 화면에서 내려받은 주문 CSV를 올려 주세요. 같은 주문을 다시 올려도 두 번 세지 않아요.</p>

        <div class="field">
          <label for="channel">어느 쇼핑몰 파일인가요?</label>
          <input class="input" id="channel" list="channel-list" maxlength="40" placeholder="예: 내 자사몰" autocomplete="off">
          <datalist id="channel-list"></datalist>
        </div>

        <label class="drop" id="drop" for="file">
          <strong>CSV 파일 고르기</strong>
          <span class="muted">여기로 끌어 놓아도 돼요. 엑셀 파일(.xlsx)은 "다른 이름으로 저장 → CSV"로 바꿔서 올려 주세요.</span>
          <input id="file" type="file" accept=".csv,.tsv,.txt,text/csv" hidden>
        </label>
        <p class="error" id="file-error" role="alert"></p>

        <div id="mapping" hidden>
          <p class="sub" style="margin:12px 0 0">파일의 어느 칸이 무엇인지 맞춰 주세요. 제가 찾은 칸을 먼저 골라 뒀어요.
            구매자 이름·연락처·주소 칸은 저장하지 않아요.</p>
          <div class="map" id="map-fields"></div>
          <div class="preview" id="preview" aria-live="polite"></div>
          <button class="btn btn-act" id="save" type="button">매출 저장하기</button>
          <div class="progress" id="progress" hidden><span></span></div>
        </div>
        <div class="done" id="done" hidden></div>
      </section>

      <div class="grid two">
        <section class="panel" id="target" aria-labelledby="t-title">
          <h2 id="t-title">이달 목표</h2>
          <p class="sub">대시보드에 목표 대비 몇 %인지 보여 줘요.</p>
          <div class="row">
            <div class="field"><label for="t-month">달</label><input class="input" id="t-month" type="month"></div>
            <div class="field"><label for="t-amount">목표 금액 (원)</label><input class="input num" id="t-amount" inputmode="numeric" placeholder="예: 30,000,000"></div>
          </div>
          <p class="error" id="t-error" role="alert"></p>
          <button class="btn btn-plain" id="t-save" type="button">목표 저장하기</button>
          <p class="muted" id="t-list"></p>
        </section>

        <section class="panel" aria-labelledby="log-title">
          <h2 id="log-title">올린 기록</h2>
          <p class="sub">최근 30개</p>
          <ul class="log" id="log"></ul>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/admin.js"></script>
</body>
</html>
